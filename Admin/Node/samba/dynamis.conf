; -> /mnt/volume/Samba/smb.conf sur dynamis. Chemins vus du conteneur (/mnt -> /shares).
; /mnt/data (Nextcloud) non partagé: écrire dedans par SMB casse ses métadonnées.

[global]
   workgroup = WORKGROUP
   server string = dynamis
   security = user
   map to guest = Never
   server min protocol = SMB2_10
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes

[media]
   path = /shares/media
   valid users = pisel, media
   read only = no
   browseable = yes
   create mask = 0664
   directory mask = 0775

[volume]
   path = /shares/volume
   valid users = pisel
   read only = no
   browseable = yes
   create mask = 0664
   directory mask = 0775

[usb_drive]
   path = /shares/usb_drive
   valid users = pisel
   read only = no
   browseable = yes
   create mask = 0664
   directory mask = 0775

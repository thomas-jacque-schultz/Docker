version: "3.8"

# Partage de fichiers SMB (lecteurs réseau Windows).
#
# POURQUOI DEUX SERVICES ET PAS UN SEUL EN MODE GLOBAL
# Un service global reçoit des variables d'environnement identiques sur tous
# les noeuds. Or cette image construit son smb.conf à partir de ces variables,
# et les partages diffèrent d'un serveur à l'autre : dynamis porte les disques
# bulk (media, usb_drive) alors que loki n'a que son /mnt/volume local. Un
# service global déclarerait donc des partages vers des chemins inexistants sur
# loki -- et Docker crée silencieusement un dossier vide dans ce cas, ce qui
# exposerait des partages vides au lieu d'échouer visiblement.
# D'où : une seule stack (déployée une fois), deux services contraints chacun
# à son noeud.
#
# POURQUOI LES PORTS SONT EN MODE HOST
# En mode ingress (le défaut), un port publié l'est à l'échelle du cluster :
# les deux services se disputeraient le 445. En mode host, chacun ne l'ouvre
# que sur son propre noeud.
#
# PRÉREQUIS : le smbd natif doit être désactivé sur les deux serveurs, sinon
# il occupe déjà le port 445 et les conteneurs ne démarreront jamais.
#
# MOTS DE PASSE : à définir dans Portainer (Stack -> Environment variables),
# comme pour les stacks Palworld. Voir .env.example. Rien en clair ici.

x-logging: &default-logging
  driver: "json-file"
  options:
    tag: "{{.Name}}"

services:
  # ---------------------------------------------------------------- dynamis
  # Stockage bulk + volumes Docker locaux.
  samba-dynamis:
    image: ghcr.io/servercontainers/samba:smbd-wsdd2-a3.24.1-s4.23.8-r0
    networks:
      - schub
    volumes:
      - /mnt/media:/shares/media
      - /mnt/volume:/shares/volume
      - /mnt/usb_drive:/shares/usb_drive
      # /mnt/data (Nextcloud) volontairement non partagé : écrire dedans par
      # SMB désynchronise la base de métadonnées de Nextcloud.
    environment:
      TZ: Europe/Paris
      SAMBA_CONF_WORKGROUP: WORKGROUP
      SAMBA_CONF_SERVER_STRING: dynamis
      SAMBA_CONF_MAP_TO_GUEST: Never

      ACCOUNT_pisel: ${SAMBA_PASSWORD_PISEL}
      UID_pisel: 1000
      ACCOUNT_media: ${SAMBA_PASSWORD_MEDIA}
      UID_media: 1001

      SAMBA_VOLUME_CONFIG_media: "[media]; path = /shares/media; valid users = pisel, media; read only = no; browseable = yes"
      SAMBA_VOLUME_CONFIG_volume: "[volume]; path = /shares/volume; valid users = pisel; read only = no; browseable = yes"
      SAMBA_VOLUME_CONFIG_usb: "[usb_drive]; path = /shares/usb_drive; valid users = pisel; read only = no; browseable = yes"
    ports:
      - target: 445
        published: 445
        protocol: tcp
        mode: host
    logging: *default-logging
    deploy:
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.labels.name == dynamis

  # ------------------------------------------------------------------- loki
  # Uniquement ses volumes Docker locaux (configs des serveurs de jeux).
  samba-loki:
    image: ghcr.io/servercontainers/samba:smbd-wsdd2-a3.24.1-s4.23.8-r0
    networks:
      - schub
    volumes:
      - /mnt/volume:/shares/volume
    environment:
      TZ: Europe/Paris
      SAMBA_CONF_WORKGROUP: WORKGROUP
      SAMBA_CONF_SERVER_STRING: loki
      SAMBA_CONF_MAP_TO_GUEST: Never

      ACCOUNT_pisel: ${SAMBA_PASSWORD_PISEL}
      UID_pisel: 1000

      SAMBA_VOLUME_CONFIG_volume: "[volume]; path = /shares/volume; valid users = pisel; read only = no; browseable = yes"
    ports:
      - target: 445
        published: 445
        protocol: tcp
        mode: host
    logging: *default-logging
    deploy:
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.labels.name == loki

networks:
  schub:
    external: true

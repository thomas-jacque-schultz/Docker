version: "3.8"

# Partage de fichiers SMB (lecteurs réseau Windows).
#
# UN SEUL SERVICE EN MODE GLOBAL
# Le spec est identique sur tous les noeuds, mais deux montages le rendent
# spécifique à chaque serveur :
#   - /mnt:/shares          -> chaque noeud n'expose que les disques qu'il a
#                              réellement (dynamis: media/volume/usb_drive/data,
#                              loki: volume seulement)
#   - le smb.conf local     -> déclare les partages propres à ce serveur
# C'est le même principe que portainer-agent avec /var/run/docker.sock :
# même chemin déclaré, contenu différent par noeud.
#
# ATTENTION : le smb.conf doit exister sur les DEUX noeuds avant le déploiement.
# Docker qui bind-monte un fichier absent crée un *dossier* à sa place, et
# l'init du conteneur échouera de façon peu lisible. Voir README.md.
#
# /mnt est monté en entier, mais seuls les partages déclarés dans smb.conf sont
# exposés. /mnt/data (Nextcloud) n'est volontairement déclaré nulle part :
# écrire dedans par SMB désynchronise sa base de métadonnées.
#
# PORTS EN MODE HOST : en mode ingress (défaut), le port serait publié à
# l'échelle du cluster, ce qui n'a pas de sens pour un service par noeud.
#
# PRÉREQUIS : smbd natif désactivé sur les deux serveurs, sinon le port 445 est
# déjà pris et le conteneur ne démarrera jamais.
#
# MOTS DE PASSE : définis dans Portainer (Stack -> Environment variables),
# comme les stacks Palworld. Voir .env.example. Rien en clair ici.

x-logging: &default-logging
  driver: "json-file"
  options:
    tag: "{{.Name}}"

services:
  samba:
    image: ghcr.io/servercontainers/samba:smbd-wsdd2-a3.24.1-s4.23.8-r0
    networks:
      - schub
    volumes:
      - /mnt:/shares
      - /mnt/volume/Samba/smb.conf:/container/config/samba/smb.conf:ro
    environment:
      TZ: Europe/Paris

      # Comptes créés sur chaque noeud. Les partages qui les référencent sont
      # définis dans le smb.conf local, donc un compte sans partage sur un
      # noeud (media sur loki) est simplement inutilisé.
      ACCOUNT_pisel: ${SAMBA_PASSWORD_PISEL}
      UID_pisel: 1000
      ACCOUNT_media: ${SAMBA_PASSWORD_MEDIA}
      UID_media: ${SAMBA_UID_MEDIA}

      # Aucun SAMBA_VOLUME_CONFIG_* ici : l'entrypoint les ajouterait par-dessus
      # le smb.conf monté. Les partages se déclarent dans le fichier.
    ports:
      - target: 445
        published: 445
        protocol: tcp
        mode: host
    logging: *default-logging
    deploy:
      mode: global
      restart_policy:
        condition: any

networks:
  schub:
    external: true

; Configuration Samba de dynamis.
; Source de vérité : ce fichier. Déployé vers /mnt/volume/Samba/smb.conf
; sur dynamis (voir README.md). Ne pas éditer directement sur l'hôte.
;
; Les chemins sont ceux vus DANS le conteneur : /mnt de l'hôte est monté
; sur /shares, donc /mnt/media -> /shares/media.

[global]
   workgroup = WORKGROUP
   server string = dynamis
   security = user
   map to guest = Never

   ; SMB1 est désactivé (obsolète et vulnérable). SMB2_10 reste compatible
   ; avec Windows 7+ ; passer à SMB3_00 si tous les clients sont récents.
   server min protocol = SMB2_10

   ; Évite que Samba tente de servir les imprimantes du système.
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes

[media]
   path = /shares/media
   valid users = pisel, media
   read only = no
   browseable = yes
   create mask = 0664
   directory mask = 0775

[volume]
   path = /shares/volume
   valid users = pisel
   read only = no
   browseable = yes
   create mask = 0664
   directory mask = 0775

[usb_drive]
   path = /shares/usb_drive
   valid users = pisel
   read only = no
   browseable = yes
   create mask = 0664
   directory mask = 0775

; /mnt/data (Nextcloud) volontairement absent : écrire dedans par SMB
; désynchronise la base de métadonnées de Nextcloud.

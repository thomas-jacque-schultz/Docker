; Configuration Samba de loki.
; Source de vérité : ce fichier. Déployé vers /mnt/volume/Samba/smb.conf
; sur loki (voir README.md). Ne pas éditer directement sur l'hôte.
;
; loki n'a que son /mnt/volume local (volumes Docker des serveurs de jeux) :
; pas de media, pas de data, pas de usb_drive. Le partage "volume" sert à
; éditer les configs des serveurs de jeux depuis l'explorateur Windows.

[global]
   workgroup = WORKGROUP
   server string = loki
   security = user
   map to guest = Never

   server min protocol = SMB2_10

   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes

[volume]
   path = /shares/volume
   valid users = pisel
   read only = no
   browseable = yes
   create mask = 0664
   directory mask = 0775

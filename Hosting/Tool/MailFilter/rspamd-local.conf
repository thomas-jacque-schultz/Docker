# Rspamd - Configuration locale pour filtrage spam/phishing

# Actions et seuils
actions {
  reject = 15;
  add_header = 6;
  greylist = 4;
}

# Phishing detection
phishing {
  symbol = "PHISHING";
}

# SPF/DKIM/DMARC
dkim {
  symbol_allow = "DKIM_VALID";
  symbol_reject = "DKIM_INVALID";
}

spf {
  symbol_allow = "SPF_ALLOW";
  symbol_reject = "SPF_REJECT";
}

dmarc {
  symbol_allow = "DMARC_ALLOW";
  symbol_reject = "DMARC_REJECT";
}

# Bayes classifier
classifier "bayes" {
  min_learns = 50;
  enabled = true;
}

# RBL checks
rbl {
  enabled = true;
}

# URL checks
surbl {
  enabled = true;
}

# Trie-based checks  
trie {
  enabled = true;
}

version: "3.8"

# Volumes

volumes:
  mongo_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/volume/BotFront/Database

# Secrets

secrets:
  MONGO_ROOT_USERNAME:
    external: true
  MONGO_ROOT_PASSWORD:
    external: true
  DISCORD_TOKEN:
    external: true
  PORTAINER_TOKEN:
    external: true

# Log Configuration

x-logging: &default-logging
  driver: "json-file"
  options:
    tag: "{{.Name}}"

# Services
#
# Images poussées par release.yml (repo Schub) -> release-docker.yml de chaque
# sous-repo, sous le namespace Docker Hub thomasschultzschub. Le tag doit être
# bumpé manuellement ici à chaque release (pas encore automatisé).

services:
  bot-mongo:
    image: mongo:7
    networks:
      - schub
    environment:
      MONGO_INITDB_ROOT_USERNAME_FILE: /run/secrets/MONGO_ROOT_USERNAME
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/MONGO_ROOT_PASSWORD
      MONGO_INITDB_DATABASE: discordbot
      TZ: Europe/Paris
    secrets:
      - MONGO_ROOT_USERNAME
      - MONGO_ROOT_PASSWORD
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging
    deploy:
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.labels.name == dynamis

  bot-back:
    image: thomasschultzschub/discord-bot:v1.2.3
    networks:
      - schub
    environment:
      MONGO_DNS_NAME: bot-mongo:27017 # example mongodb://admin:change-me@bot-mongo:27017/discordbot?authSource=admin
      MONGO_DB: discordbot
      DISCORD_ADMIN_ID: 245281978054737920
      DISCORD_ADMIN_USERNAME: admin
      PORTAINER_VIRTUAL_HOST: default-value
      BOT_INTERNAL_SECRET: ${BOT_INTERNAL_SECRET}
      TZ: Europe/Paris
    secrets:
      - source: MONGO_ROOT_USERNAME
      - source: MONGO_ROOT_PASSWORD
      - source: DISCORD_TOKEN
      - source: PORTAINER_TOKEN
    depends_on:
      - bot-mongo
    ports:
      - "8081:8080"
    logging: *default-logging
    deploy:
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.labels.name == dynamis

  bot-front:
    image: thomasschultzschub/bot-front:v1.2.3
    networks:
      - schub
    depends_on:
      - bot-back
    ports:
      - "8080:80"
    environment:
      TZ: Europe/Paris
    logging: *default-logging
    deploy:
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.labels.name == dynamis

  schub-back:
    image: thomasschultzschub/schub-back:v1.2.3
    networks:
      - schub
    environment:
      # Même Mongo que bot-back, base séparée. MONGO_ROOT_USERNAME/PASSWORD sont
      # des secrets Docker (fichiers) pour bot-mongo/bot-back, pas des variables
      # de compose — ${...} ne peut pas les lire ici. Il faut redéfinir les mêmes
      # valeurs comme variables d'environnement Portainer (Stack -> Environment
      # variables), en plus des secrets Docker déjà en place, pour que cette
      # substitution fonctionne.
      SPRING_DATA_MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@bot-mongo:27017/backend?authSource=admin
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
      AUTH_JWT_EXPIRATION_SECONDS: 3600
      AUTH_ADMIN_USERNAME: ${AUTH_ADMIN_USERNAME}
      AUTH_ADMIN_PASSWORD: ${AUTH_ADMIN_PASSWORD}
      AUTH_CORS_ALLOWED_ORIGINS: https://dev.schultz-thomas.fr
      BOT_BASE_URL: http://bot-back:8080
      BOT_INTERNAL_SECRET: ${BOT_INTERNAL_SECRET}
      TZ: Europe/Paris
    depends_on:
      bot-mongo:
        condition: service_healthy
      bot-back:
        condition: service_started
    ports:
      - "8082:8080"
    logging: *default-logging
    deploy:
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.labels.name == dynamis

# Networks

networks:
  schub:
    external: true

name: schub-dev

services:
  bot-mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
      TZ: Europe/Paris
    volumes:
      - mongo_data_dev:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "27017:27017"
    networks:
      - schub

  bot-back:
    build:
      context: ../../../../Schub/schub-back-bot-server
      dockerfile: Dockerfile.dev
    volumes:
      # Chemin hôte réel (pas le chemin vu dans ce conteneur) : docker.sock est
      # celui de l'hôte, donc les volumes bind sont résolus par son dockerd, qui
      # ne connaît que /home/pisel/... — voir Admin/Manager/docker-compose.yml.
      - /home/pisel/projet/Schub/schub-back-bot-server/src:/usr/src/app/src
    environment:
      MONGO_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_HOST: bot-mongo
      MONGO_DB: ${MONGO_DB}
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      DISCORD_ADMIN_ID: ${DISCORD_ADMIN_ID}
      DISCORD_ADMIN_USERNAME: ${DISCORD_ADMIN_USERNAME}
      PORTAINER_VIRTUAL_HOST: ${PORTAINER_VIRTUAL_HOST}
      PORTAINER_TOKEN: ${PORTAINER_TOKEN}
      BOT_INTERNAL_SECRET: ${BOT_INTERNAL_SECRET:-change-me-bot-internal-secret}
      TZ: Europe/Paris
    depends_on:
      - bot-mongo
    ports:
      - "127.0.0.1:18081:8080"
    networks:
      - schub

  bot-front:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - /home/pisel/projet/Schub/schub-front-servers:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 80"
    depends_on:
      - bot-back
    networks:
      - schub
    ports:
      - "18090:80"
    environment:
      TZ: Europe/Paris

  schub-back:
    build:
      context: ../../../../Schub/schub-back-bff
      dockerfile: Dockerfile.dev
    volumes:
      - /home/pisel/projet/Schub/schub-back-bff/src:/usr/src/app/src
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@bot-mongo:27017/${SCHUB_MONGO_DB}?authSource=admin
      AUTH_JWT_SECRET: ${APP_JWT_SECRET:-change-this-jwt-secret-key-with-at-least-32-characters}
      AUTH_JWT_EXPIRATION_SECONDS: ${APP_JWT_EXPIRATION_SECONDS:-3600}
      AUTH_ADMIN_USERNAME: ${APP_ADMIN_USERNAME:-admin}
      AUTH_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-change-me}
      AUTH_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:18090,http://localhost:5173,https://dev.schultz-thomas.fr}
      BOT_BASE_URL: http://bot-back:8080
      BOT_INTERNAL_SECRET: ${BOT_INTERNAL_SECRET:-change-me-bot-internal-secret}
      TZ: Europe/Paris
    depends_on:
      bot-mongo:
        condition: service_healthy
      bot-back:
        condition: service_started
    ports:
      - "18082:8080"
    networks:
      - schub

volumes:
  mongo_data_dev:
networks:
  schub:
    external: true

version: "3"

vars:
  COMPOSE_CMD: docker compose --env-file .env.dev.example -f docker-compose.dev.yml
  DEV_SERVICES: bot-back bot-front schub-back

tasks:
  run:dev:
    desc: "Lance tous les conteneurs de dev (avec rebuild)"
    cmds:
      - "{{.COMPOSE_CMD}} up --build -d --force-recreate"

  run:dev:app:
    desc: "Relance uniquement bot-back et bot-front (sans mongo)"
    cmds:
      - "{{.COMPOSE_CMD}} up --build -d --force-recreate {{.DEV_SERVICES}}"

  run:dev:service:
    desc: "Relance un seul service. Usage: task run:dev:service -- bot-back"
    cmds:
      - "{{.COMPOSE_CMD}} up --build -d --force-recreate {{.CLI_ARGS}}"

  down:
    desc: "Arrête tous les conteneurs"
    cmds:
      - "{{.COMPOSE_CMD}} down"

  logs:
    desc: "Affiche les logs. Usage: task logs (tous) ou task logs -- bot-back"
    cmds:
      - "{{.COMPOSE_CMD}} logs -f {{.CLI_ARGS}}"

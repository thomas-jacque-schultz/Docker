services:
  bot-mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
      TZ: Europe/Paris
    volumes:
      - mongo_data_dev:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "27017:27017"
    networks:
      - schub

  bot-back:
    build:
      context: ../../../../Bot
      dockerfile: Dockerfile.dev
    environment:
      MONGO_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_HOST: bot-mongo
      MONGO_DB: ${MONGO_DB}
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      DISCORD_ADMIN_ID: ${DISCORD_ADMIN_ID}
      DISCORD_ADMIN_USERNAME: ${DISCORD_ADMIN_USERNAME}
      PORTAINER_VIRTUAL_HOST: ${PORTAINER_VIRTUAL_HOST}
      PORTAINER_TOKEN: ${PORTAINER_TOKEN}
      APP_ADMIN_USERNAME: ${APP_ADMIN_USERNAME:-admin}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-change-me}
      APP_JWT_SECRET: ${APP_JWT_SECRET:-change-this-jwt-secret-key-with-at-least-32-characters}
      APP_JWT_EXPIRATION_SECONDS: ${APP_JWT_EXPIRATION_SECONDS:-3600}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:18090,http://localhost:5173,https://dev.schultz-thomas.fr}
      TZ: Europe/Paris
    depends_on:
      - bot-mongo
    ports:
      - "18081:8080"
    networks:
      - schub

  bot-front:
    build:
      context: ../../../../Front
      dockerfile: Dockerfile
    depends_on:
      - bot-back
    networks:
      - schub
    ports:
      - "18090:80"
    environment:
      TZ: Europe/Paris

volumes:
  mongo_data_dev:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/volume/MongoBotDev

networks:
  schub:
    external: true